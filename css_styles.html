  /* Hacer checkboxes grandes estilo Google Forms */
  .checkbox-group input[type="checkbox"] {
    display: none; /* ocultamos el checkbox original */
  }

  .checkbox-option {
    position: relative;
    padding-left: 50px; /* espacio para el nuevo checkbox */
    cursor: pointer;
    font-size: 38px; /* tamaño de texto grande */
    user-select: none;

  .checkbox-option-inner {

  .radio-option-inner {

  /* Cuadrado grande que simula el checkbox */
  .checkbox-group .checkbox-option::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 50px;  /* ancho del checkbox */
    height: 50px; /* alto del checkbox */
    border: 2px solid #dadce0;
    border-radius: 4px;
    background-color: #fff;
    box-sizing: border-box;
    transition: background 0.2s, border-color 0.2s;
    margin: 0px 0px 0px -35px;
  }

  /* Cuando el checkbox real está marcado */
  .checkbox-group input[type="checkbox"]:checked + .checkbox-option::before {
    background-color: rgb(103, 58, 183);
    border-color: #1a73e8;
  }

  /* Agregar “check mark” cuando está marcado */
  .checkbox-group input[type="checkbox"]:checked + .checkbox-option::after {
    content: "✔"; /* marca de check */
    position: absolute;
    left: 6px;
    top: -2px;
    color: white;
    font-size: 50px;
    margin: -10px 0px 0px -35px;
  }
