<script>
let otroCount = 0; // contador de campos dinámicos
const otrosContainer = $('otrosContainer'); 
function addOtro() {
  otroCount++;

  const div = document.createElement('div');
  div.className = 'otros-item';
  div.id = `otro-${otroCount}`;

  div.innerHTML = `
    <input class="secondary-text" type="text" name="otroConcepto[]" placeholder="Kontzeptua" required>
    <input class="secondary-text" type="number" name="otroPrecio[]" placeholder="Prezioa" min="0" required>
    <select class="secondary-text" name="otroTipo[]">
      <option value="nuevoCampo">Nuevo campo del presupuesto</option>
      <option value="precioBase">Añadir al precio base</option>
    </select>
    <button class="secondary-text delete-button" type="button">Eliminar</button>
  `;

  // Agregar listener al botón de eliminar
  const btnDelete = div.querySelector('.delete-button');
  btnDelete.addEventListener('click', () => {
    removeOtro(div.id);
  });

  otrosContainer.appendChild(div);
}

function removeOtro(id) {
  const div = $(id);
  if (div) div.remove();
}
</script>
